apiVersion: apps/v1
kind: Deployment
metadata:
  name: iccsys
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: iccsys
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iccsys
    spec:
      containers:
        - image: scgskku/iccsys
          imagePullPolicy: Always
          name: iccsys
          ports:
            - containerPort: 8091
          livenessProbe:
            httpGet:
              path: /iccsys/health/liveness
              port: 8091
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /iccsys/health/readiness
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: iccsys-secret
