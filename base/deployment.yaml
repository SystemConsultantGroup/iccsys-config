apiVersion: apps/v1
kind: Deployment
metadata:
  name: iccsys
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: iccsys
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iccsys
    spec:
      containers:
        - image: scgskku/iccsys
          imagePullPolicy: Always
          name: iccsys
          ports:
            - containerPort: 8091
          envFrom:
            - secretRef:
                name: iccsys-secret
